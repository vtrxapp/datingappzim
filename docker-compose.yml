services:
  postgres:
    image: postgres:16-alpine
    container_name: datingappzim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datingapp
      POSTGRES_PASSWORD: datingapp
      POSTGRES_DB: datingappzim
    ports:
      - "5432:5432"
    volumes:
      - datingappzim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datingapp -d datingappzim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: datingappzim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - datingappzim-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datingappzim-postgres-data:
  datingappzim-redis-data:
