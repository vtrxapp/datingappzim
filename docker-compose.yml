services:
  postgres:
    image: postgres:16-alpine
    container_name: tariro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tariro
      POSTGRES_PASSWORD: tariro
      POSTGRES_DB: tariro
    ports:
      - "5432:5432"
    volumes:
      - tariro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariro -d tariro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tariro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tariro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tariro-postgres-data:
  tariro-redis-data:
